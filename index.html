<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Playground · Built.at</title>
<meta name="description" content="Paste HTML and edit it visually in the Built.at playground.">
<link rel="icon" href="/_brand/logo.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#fff;color:#171717;font:16px system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid #eee}
.brand{display:inline-flex;align-items:center;gap:8px;color:inherit;text-decoration:none;font-weight:750}
main{width:min(720px,calc(100% - 32px));margin:clamp(24px,8vh,80px) auto}
h1{margin:0 0 16px;font-size:clamp(28px,6vw,42px)}
label{display:block;margin-bottom:8px}
textarea{display:block;width:100%;min-height:230px;resize:vertical;border:1px solid #ddd;border-radius:12px;padding:14px;font:14px/1.5 monospace}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{font:inherit;border:1px solid #ddd;border-radius:999px;background:white;color:#171717;padding:8px 15px;cursor:pointer}
button[type=submit]{background:#171717;color:#fff;border-color:#171717}
iframe{display:block;width:100%;border:0;flex:1;min-height:0}
</style>
</head>
<body>
<header>
<a class="brand" href="/"><img src="/_brand/logo.svg" width="25" height="25" alt="">Built.at</a>
<button id="paste-again" type="button" hidden>Paste HTML</button>
</header>
<main id="entry">
<h1>HTML Playground</h1>
<form id="paste-form">
<label for="html-source">Paste your HTML</label>
<textarea id="html-source" required spellcheck="false" placeholder="&lt;!doctype html&gt;"></textarea>
<div class="actions"><button type="submit">Open in editor</button><button type="button" id="sample">Try a sample</button></div>
</form>
</main>
<iframe id="preview" title="HTML Playground editor" sandbox="allow-scripts" hidden></iframe>
<script>
const entry=document.getElementById('entry'),source=document.getElementById('html-source');
const preview=document.getElementById('preview'),pasteAgain=document.getElementById('paste-again');
function openEditor(html){
  const page=new DOMParser().parseFromString(html,'text/html');
  for(const script of page.querySelectorAll('script[src]')){
    const src=script.getAttribute('src');
    if(/^https:\/\/(?:edit|side-edit)\.built\.at(?:[/?#]|$)/i.test(src))script.remove();
  }
  const loader=page.createElement('script');
  loader.src='https://edit.built.at/';
  loader.defer=true;
  loader.setAttribute('data-built-at-workspace','');
  page.head.append(loader);
  preview.srcdoc='<!doctype html>'+page.documentElement.outerHTML;
  entry.hidden=true;preview.hidden=false;pasteAgain.hidden=false;
}
document.getElementById('paste-form').onsubmit=event=>{
  event.preventDefault();
  if(source.value.trim())openEditor(source.value);
};
document.getElementById('sample').onclick=()=>openEditor('<title>Playground sample</title><main data-edit="Sample section" style="max-width:640px;margin:64px auto;padding:24px;font-family:system-ui"><h1 data-edit="Sample headline">Make it yours</h1><p data-edit="Sample description">Select this text and try the toolbar.</p></main>');
pasteAgain.onclick=()=>{preview.hidden=true;entry.hidden=false;pasteAgain.hidden=true;source.focus()};
</script>
</body>
</html>
