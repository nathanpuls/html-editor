<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor · Built.at</title>
<link rel="icon" href="/_brand/logo.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
body{margin:0;background:white;color:#171717;font:15px system-ui,sans-serif}
iframe{display:block;width:100%;height:100dvh;border:0}
dialog{width:min(600px,calc(100% - 24px));border:1px solid #ddd;border-radius:16px;padding:16px}
dialog::backdrop{background:#0005}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
textarea{display:block;width:100%;min-height:180px;padding:10px;resize:vertical;border:1px solid #ddd;border-radius:8px;font:14px monospace}
button{font:inherit;cursor:pointer;border:1px solid #ddd;border-radius:999px;background:white;padding:6px 12px}
button[type=submit]{margin-top:10px;background:#171717;color:white;border-color:#171717}
#save-status{position:fixed;bottom:16px;right:16px;margin:0;padding:8px 12px;border-radius:8px;background:#171717;color:white}
#save-status:empty{display:none}
</style>
</head>
<body>
<iframe id="workspace" title="Built.at editor workspace" sandbox="allow-scripts" allow="clipboard-write *"></iframe>
<dialog aria-labelledby="paste-title">
<header><strong id="paste-title">Paste HTML</strong><button type="button" aria-label="Close paste dialog">×</button></header>
<form><textarea aria-label="HTML source" placeholder="Paste your HTML here" required spellcheck="false"></textarea><button type="submit">Open in editor</button></form>
</dialog>
<p id="save-status" role="status"></p>
<script>
const frame=document.getElementById('workspace'),dialog=document.querySelector('dialog'),source=dialog.querySelector('textarea');
const status=document.getElementById('save-status'),key='built-at:editor:workspace:v1';
let documentState=null,revision=0;
try{
 const saved=JSON.parse(localStorage.getItem(key)||'null');
 if(saved&&typeof saved.html==='string')documentState=saved;
}catch{}
const emptyMarkup='<title>Editor · Built.at</title><style data-built-at-editor-runtime>body{margin:0;background:#fff}#workspace-hint{position:fixed;max-width:calc(100vw - 24px);display:grid;justify-items:end;gap:5px;color:#666;font:14px system-ui,sans-serif}#workspace-hint svg{margin-right:calc(var(--paste-center,32px) - 9px)}#ie-toolbar #ie-paste{background:#171717;color:#fff;border-color:#171717}#ie-toolbar #ie-copy{background:#fff;color:#777;border:1px solid #ddd}</style><div id="workspace-hint" data-built-at-editor-runtime><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-7 7 7-7 7 7"/></svg><span>Paste Built HTML to get started</span></div>';
function save(){
 try{localStorage.setItem(key,JSON.stringify(documentState));status.textContent=''}
 catch{status.textContent='Browser storage is unavailable. Use Copy to keep your HTML.'}
}
function render(){
 const page=new DOMParser().parseFromString(documentState?.html||emptyMarkup,'text/html');
 for(const script of page.querySelectorAll('script[src]')){
  if(/^https:\/\/(?:edit|side-edit)\.built\.at(?:[/?#]|$)/i.test(script.getAttribute('src')))script.remove();
 }
 const loader=page.createElement('script');
 loader.src='https://edit.built.at/?v=20261120-color-swatches';
 loader.defer=true;
 loader.setAttribute('data-built-at-workspace',String(++revision));
 if(!documentState)loader.setAttribute('data-built-at-workspace-empty','');
 if(typeof documentState?.draft==='string')loader.setAttribute('data-built-at-draft',documentState.draft);
 try{
  const recent=localStorage.getItem('built-at:editor:recent-colors');
  if(recent)loader.setAttribute('data-built-at-recent-colors',recent);
 }catch{}
 page.head.append(loader);
 frame.srcdoc='<!doctype html>'+page.documentElement.outerHTML;
}
window.addEventListener('message',event=>{
 if(event.source!==frame.contentWindow||event.origin!=='null'||event.data?.revision!==String(revision))return;
 if(event.data?.type==='built-at:workspace-paste'){
  if(!dialog.open){dialog.showModal();source.focus()}
 }else if(event.data?.type==='built-at:workspace-recent-colors'){
  const value=event.data.value;
  if(typeof value==='string'&&value.length<=150)try{localStorage.setItem('built-at:editor:recent-colors',value)}catch{}
 }else if(event.data?.type==='built-at:workspace-draft'&&documentState){
  const draft=event.data.draft;
  if(draft!==null&&typeof draft!=='string')return;
  documentState.draft=draft;save();
 }
});
dialog.querySelector('header button').onclick=()=>dialog.close();
dialog.querySelector('form').onsubmit=event=>{
 event.preventDefault();
 const html=source.value.trim();if(!html)return;
 documentState={html,draft:null};save();render();source.value='';dialog.close();
};
render();
</script>
</body>
</html>
